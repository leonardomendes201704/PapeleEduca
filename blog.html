  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --surface-2: #f2efe7;
      --text: #263238;
      --muted: #6c7a86;
      --line: #d8d2c6;
      --accent: #2fb7b0;
      --accent-2: #f4a53b;
      --accent-3: #7c6ae6;
      --shadow: 0 14px 40px rgba(35, 41, 50, 0.08);
      --radius: 28px;
      --radius-sm: 18px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 165, 59, 0.16), transparent 22%),
        radial-gradient(circle at top right, rgba(47, 183, 176, 0.14), transparent 20%),
        linear-gradient(180deg, #f8f4ec 0%, #fbfaf7 34%, #f7f4ef 100%);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    .page {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 40px;
      zoom: 0.65;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 210, 198, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .brand-mark {
      height: 90px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .brand-mark img {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      font-weight: 600;
      color: #40505c;
      margin-left: auto;
    }

    .nav a {
      padding: 6px 2px;
      border-bottom: 3px solid transparent;
      transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, opacity 180ms ease;
      transform-origin: center;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: #1f9f9b;
      transform: translateY(-2px) scale(1.06);
    }

    .nav a.active { border-bottom-color: var(--accent-2); }
    .nav a.active:hover,
    .nav a.active:focus-visible { border-bottom-color: var(--accent-2); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #27b4ae, #20a8bb);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(39, 180, 174, 0.22);
      white-space: nowrap;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      transform-origin: center;
      will-change: transform;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 16px 32px rgba(39, 180, 174, 0.3);
      filter: brightness(1.03);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 8px 18px rgba(39, 180, 174, 0.2);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .btn-icon.right {
      width: 16px;
      height: 16px;
    }

    .btn-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .whatsapp-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #28d366, #128c7e);
      color: #fff;
      box-shadow: 0 16px 30px rgba(18, 140, 126, 0.32);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .whatsapp-float:hover,
    .whatsapp-float:focus-visible {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 20px 36px rgba(18, 140, 126, 0.38);
      filter: brightness(1.02);
    }

    .whatsapp-float img {
      width: auto;
      height: 30px;
      display: block;
    }

    .section {
      margin-top: 30px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(216, 210, 198, 0.72);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .section-head {
      text-align: center;
      margin-bottom: 22px;
    }

    .section-head h1 {
      font-size: clamp(1.9rem, 3.6vw, 3rem);
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .section-head p {
      color: var(--muted);
      margin: 0 auto;
      max-width: 56ch;
      line-height: 1.6;
    }

    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      line-height: 1.6;
    }

    .post-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    .post-card {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.2fr);
      gap: 0;
      overflow: hidden;
      background: linear-gradient(180deg, #fff, #fcfaf6);
      border: 1px solid var(--line);
      border-radius: 28px;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .post-card:hover,
    .post-card:focus-within {
      transform: translateY(-3px);
      box-shadow: 0 16px 36px rgba(35, 41, 50, 0.1);
    }

    .post-card-media {
      min-height: 240px;
      background: #e8e2d6;
    }

    .post-card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .post-card-body {
      padding: 24px 26px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .post-card-tag {
      display: inline-flex;
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(47, 183, 176, 0.12);
      color: #1f8f8a;
      font-size: 0.8rem;
      font-weight: 800;
    }

    .post-card-meta {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .post-card h2 {
      margin: 0;
      font-size: clamp(1.25rem, 2.4vw, 1.7rem);
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .post-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .post-card-link {
      margin-top: 8px;
      color: #1f8f8a;
      font-weight: 800;
    }

    .footer {
      margin-top: 28px;
      padding: 18px 8px 8px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .socials img {
      height: 42px;
      width: auto;
    }

    @media (max-width: 900px) {
      .topbar {
        flex-wrap: wrap;
        border-radius: 24px;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
        margin-left: 0;
        gap: 16px;
      }
    }

    @media (max-width: 860px) {
      .post-card {
        grid-template-columns: 1fr;
      }

      .post-card-media {
        min-height: 200px;
        aspect-ratio: 16 / 9;
      }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 20px, var(--max)); padding-top: 10px; }
      .section { border-radius: 28px; padding: 18px; }
      .footer-top { justify-content: center; text-align: center; }
      .post-card-body { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Papelê Educa">

    <section class="section" id="blog">

      <p style="margin-top:14px;">© 2026 Papelê Educa. Todos os direitos reservados.</p>

  </main>
