<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papelê Educa - Todas as atividades</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --surface-2: #f2efe7;
      --text: #263238;
      --muted: #6c7a86;
      --line: #d8d2c6;
      --accent: #2fb7b0;
      --accent-2: #f4a53b;
      --accent-3: #7c6ae6;
      --shadow: 0 14px 40px rgba(35, 41, 50, 0.08);
      --radius: 28px;
      --radius-sm: 18px;
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 165, 59, 0.16), transparent 22%),
        radial-gradient(circle at top right, rgba(47, 183, 176, 0.14), transparent 20%),
        linear-gradient(180deg, #f8f4ec 0%, #fbfaf7 34%, #f7f4ef 100%);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    .page {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 210, 198, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 0 0 auto;
    }

    .brand-mark {
      height: 90px;
      width: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .brand-mark img {
      display: block;
      width: auto;
      height: 100%;
      object-fit: contain;
    }

    .nav {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      font-weight: 600;
      color: #40505c;
      margin-left: auto;
    }

    .nav a {
      padding: 6px 2px;
      border-bottom: 3px solid transparent;
      transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, opacity 180ms ease;
      transform-origin: center;
    }

    .nav a:hover,
    .nav a:focus-visible {
      color: #1f9f9b;
      transform: translateY(-2px) scale(1.06);
    }

    .nav a.active { border-bottom-color: var(--accent-2); }
    .nav a.active:hover,
    .nav a.active:focus-visible { border-bottom-color: var(--accent-2); }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #27b4ae, #20a8bb);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(39, 180, 174, 0.22);
      white-space: nowrap;
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
      transform-origin: center;
      will-change: transform;
    }

    .btn:hover,
    .btn:focus-visible {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 16px 32px rgba(39, 180, 174, 0.3);
      filter: brightness(1.03);
    }

    .btn:active {
      transform: translateY(0) scale(0.98);
      box-shadow: 0 8px 18px rgba(39, 180, 174, 0.2);
    }

    .btn-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 auto;
    }

    .btn-icon.right {
      width: 16px;
      height: 16px;
    }

    .btn-icon svg {
      width: 100%;
      height: 100%;
      fill: currentColor;
    }

    .section {
      margin-top: 30px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(216, 210, 198, 0.72);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .section-head {
      text-align: center;
      margin-bottom: 22px;
    }

    .section-head h1 {
      font-size: clamp(1.9rem, 3.6vw, 3rem);
      letter-spacing: -0.03em;
      margin-bottom: 8px;
    }

    .section-head p {
      color: var(--muted);
      margin: 0 auto;
      max-width: 56ch;
      line-height: 1.6;
    }

    .summary-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px;
      padding: 14px 16px;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(216, 210, 198, 0.72);
      border-radius: 20px;
      color: #4f6a81;
      font-weight: 700;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
    }

    .product {
      position: relative;
      background: linear-gradient(180deg, #fff, #fcfaf6);
      border: 1px solid var(--line);
      border-radius: 26px;
      padding: 18px;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .product-media {
      margin-top: 18px;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(216, 210, 198, 0.65);
      aspect-ratio: 1.18 / 0.82;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tag {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fff;
    }

    .tag.pink { background: #ef6f8f; }
    .tag.yellow { background: #f2c24f; color: #5b4622; }
    .tag.teal { background: #2bb9b0; }

    .product h3 {
      margin: 2px 0 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .product-category,
    .product-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .product-category {
      font-weight: 700;
      color: #4f6a81;
    }

    .product-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.1em;
    }

    .product-actions {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .price {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .stars {
      color: #f3b81f;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    .product-details {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff4f7;
      color: #ef6f8f;
      border: 1px solid rgba(239, 111, 143, 0.22);
      font-weight: 800;
      font-size: 0.92rem;
      line-height: 1;
    }

    .product-add {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
      background: #ffe7ef;
      color: #ef6f8f;
      border: none;
      flex: 0 0 auto;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .page-btn {
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      color: #40505c;
      border-radius: 999px;
      padding: 12px 16px;
      font-weight: 800;
      min-width: 46px;
      text-align: center;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease, color 180ms ease;
    }

    .page-btn:hover,
    .page-btn:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 18px rgba(35, 41, 50, 0.08);
    }

    .page-btn.active {
      background: linear-gradient(90deg, #27b4ae, #20a8bb);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 10px 24px rgba(39, 180, 174, 0.22);
    }

    .page-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-weight: 700;
      border: 1px dashed var(--line);
      border-radius: 24px;
      background: rgba(255,255,255,0.74);
    }

    .footer {
      margin-top: 30px;
      padding: 24px 10px 10px;
      text-align: center;
      color: var(--muted);
    }

    .footer-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(216, 210, 198, 0.85);
      padding-top: 18px;
    }

    .socials {
      width: min(100%, 300px);
    }

    .socials img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 1120px) {
      .products { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }

    @media (max-width: 860px) {
      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .nav {
        justify-content: flex-start;
        margin-left: 0;
      }

      .products { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 20px, var(--max)); padding-top: 10px; }
      .section { border-radius: 28px; padding: 18px; }
      .products { grid-template-columns: 1fr; }
      .footer-top { justify-content: center; text-align: center; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Papelê Educa">
        <div class="brand-mark">
          <img src="images/logo-header.png" alt="Papelê Educa" />
        </div>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <a href="./index.html">Início</a>
        <a class="active" href="./atividades.html">Atividades</a>
        <a href="./index.html#contato">Contato</a>
      </nav>

      <a class="btn" href="./index.html#categorias">
        <span class="btn-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M20.7 3.3a1 1 0 0 0-1.06-.24L4.6 8.81a1 1 0 0 0-.06 1.82l5.74 2.62 2.62 5.74a1 1 0 0 0 1.82-.06l5.75-15.04a1 1 0 0 0-.24-1.06Zm-7.26 13.5-1.8-3.93 3.93-3.93-2.13-2.13 5.1-2.02-2.02 5.1-2.13-2.13-3.93 3.93-3.93-1.8 10.91-4.19-4.1 10.17Z"/>
          </svg>
        </span>
        <span class="btn-label">Explorar materiais</span>
        <span class="btn-icon right" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
            <path d="M13.2 5.3a1 1 0 0 1 1.4 0l5.8 5.8a1 1 0 0 1 0 1.4l-5.8 5.8a1 1 0 1 1-1.4-1.4l4.1-4.1H5a1 1 0 1 1 0-2h12.3l-4.1-4.1a1 1 0 0 1 0-1.4Z"/>
          </svg>
        </span>
      </a>
    </header>

    <section class="section" id="catalogo">
      <div class="section-head">
        <h1>Todas as atividades</h1>
        <p>Explore os materiais publicados em uma vitrine contínua, com paginação de 12 itens por página e cartões em quatro colunas no desktop.</p>
      </div>

      <div class="summary-bar">
        <span id="results-count">0 atividades encontradas</span>
        <span id="page-summary">Página 1 de 1</span>
      </div>

      <div id="activities-grid" class="products" aria-live="polite"></div>
      <div id="activities-pagination" class="pagination" aria-label="Paginação de atividades"></div>
    </section>

    <footer class="footer" id="sobre">
      <div class="footer-top">
        <div class="socials" aria-label="Redes sociais">
          <img src="images/icones-redes.png" alt="Ícones de redes sociais" />
        </div>
      </div>

      <p style="margin-top:14px;">© 2026 Papelê Educa. Todos os direitos reservados.</p>
    </footer>
  </main>
  <script type="module" src="./js/atividades.js"></script>
</body>
</html>
