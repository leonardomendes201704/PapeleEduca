<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papelê Educa - Acesso Admin</title>
  <link rel="stylesheet" href="./css/admin.css" />
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="../images/logo-header.png" alt="Papelê Educa" />
      </div>

      <h1>Área protegida</h1>
      <p class="muted">Entre com seu e-mail e senha do Supabase para gerenciar os materiais.</p>

      <form id="login-form" class="auth-form">
        <label>
          E-mail
          <input id="email" type="email" placeholder="voce@seudominio.com" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input id="password" type="password" placeholder="Sua senha" autocomplete="current-password" required />
        </label>
        <button class="btn-primary" type="submit">Entrar</button>
        <p class="form-status" id="status"></p>
      </form>

      <a class="auth-link" href="../index.html">Voltar para o site</a>
    </section>
  </main>

  <script type="module">
    import { supabase } from './js/supabase-client.js';

    const form = document.getElementById('login-form');
    const statusEl = document.getElementById('status');

    const { data } = await supabase.auth.getSession();
    if (data.session) {
      window.location.href = './dashboard.html';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      statusEl.textContent = 'Entrando...';
      statusEl.className = 'form-status';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        statusEl.textContent = error.message;
        statusEl.classList.add('error');
        return;
      }

      window.location.href = './dashboard.html';
    });
  </script>
  <a
    class="whatsapp-float"
    href="https://wa.me/5513997291237?text=Ol%C3%A1%21%20Vim%20pelo%20site%20Papel%C3%AA%20Educa%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es."
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chamar no WhatsApp"
    title="Falar no WhatsApp"
  >
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path d="M16 3C9.4 3 4 8.2 4 14.6c0 2.3.7 4.5 2 6.4L5 29l7.7-1.8c1.7.9 3.8 1.4 5.8 1.4 6.6 0 12-5.2 12-11.6S22.6 3 16 3Zm0 21.2c-2 0-3.8-.5-5.5-1.5l-.4-.2-4.6 1.1 1.2-4.3-.3-.5c-1.2-1.7-1.8-3.7-1.8-5.7 0-5 4.2-9 9.4-9s9.4 4 9.4 9-4.2 9.1-9.4 9.1Zm5.4-6.9c-.3-.2-1.8-.9-2-1s-.4-.2-.5.2c-.2.3-.6 1-.8 1.2-.1.2-.3.2-.6.1-.3-.2-1.1-.4-2.1-1.2-.8-.7-1.3-1.5-1.4-1.8-.1-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5s-.5-1.3-.7-1.8c-.2-.5-.4-.4-.5-.4h-.4c-.1 0-.4.1-.6.3-.2.2-.8.8-.8 1.9s.8 2.1.9 2.3c.1.2 1.6 2.4 3.9 3.4.5.2.9.3 1.2.4.5.1.9.1 1.2.1.4-.1 1.2-.5 1.4-1 .2-.5.2-.9.1-1-.1-.2-.3-.2-.6-.4Z"/>
    </svg>
  </a>
</body>
</html>
