<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecionando… | Papelê Educa</title>
  <script>
    (function () {
      var parts = location.pathname.split('/').filter(Boolean);
      var file = parts[parts.length - 1] || '';
      var slug = file.replace(/\.html$/i, '');
      if (slug) location.replace('/blog/' + encodeURIComponent(slug));
      else location.replace('/blog.html');
    })();
  </script>
</head>
<body>
  <p>Redirecionando para o post…</p>
</body>
</html>
