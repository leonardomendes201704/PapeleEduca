<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Papelê Moderação</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="toast" class="toast" hidden></div>

  <div id="loading-overlay" class="loading-overlay" hidden>
    <div class="loading-card" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p id="loading-text">Aguarde…</p>
    </div>
  </div>

  <div id="result-modal" class="modal" hidden>
    <div class="modal-card result-card">
      <div id="result-icon" class="result-icon" aria-hidden="true"></div>
      <h2 id="result-title">Pronto</h2>
      <p class="meta" id="result-message"></p>
      <div class="modal-actions modal-actions-single">
        <button type="button" class="btn btn-primary" id="result-ok">OK</button>
      </div>
    </div>
  </div>

  <div id="fb-modal" class="modal" hidden>
    <div class="modal-card">
      <h2>Postar no Facebook</h2>
      <p class="meta" id="fb-modal-title"></p>
      <label>
        Mensagem
        <textarea id="fb-modal-message" rows="6"></textarea>
      </label>
      <p id="fb-modal-error" class="form-error" hidden></p>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" id="fb-modal-cancel">Cancelar</button>
        <button type="button" class="btn btn-facebook" id="fb-modal-confirm">Publicar</button>
      </div>
    </div>
  </div>

  <section id="screen-login" class="screen screen-login">
    <div class="login-bg" aria-hidden="true"></div>
    <div class="login-card">
      <p class="brand">Papelê Educa</p>
      <h1>Moderação do blog</h1>
      <p class="lede">Revise rascunhos da automação, aprove ou rejeite, e poste no Facebook.</p>
      <form id="login-form" class="login-form">
        <label>
          E-mail
          <input id="login-email" type="email" autocomplete="username" required />
        </label>
        <label>
          Senha
          <input id="login-password" type="password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="form-error" hidden></p>
        <button type="submit" class="btn btn-primary" id="login-submit">Entrar</button>
      </form>
    </div>
  </section>

  <section id="screen-list" class="screen screen-with-nav" hidden>
    <header class="topbar">
      <div>
        <p class="brand-sm">Papelê Educa</p>
        <h1>Posts</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="btn-refresh" title="Atualizar">↻</button>
        <button type="button" class="btn btn-ghost" id="btn-logout">Sair</button>
      </div>
    </header>
    <div class="filters">
      <button type="button" class="chip active" data-filter="draft">Rascunhos</button>
      <button type="button" class="chip" data-filter="published">Publicados</button>
      <button type="button" class="chip" data-filter="all">Todos</button>
    </div>
    <div id="posts-list" class="posts-list"></div>
    <p id="list-empty" class="empty" hidden>Nenhum post nesta lista.</p>
  </section>

  <section id="screen-metrics" class="screen screen-with-nav" hidden>
    <header class="topbar">
      <div>
        <p class="brand-sm">Papelê Educa</p>
        <h1>Métricas</h1>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn btn-ghost" id="btn-metrics-refresh" title="Atualizar">↻</button>
        <button type="button" class="btn btn-ghost" id="btn-metrics-logout">Sair</button>
      </div>
    </header>
    <div id="metrics-kpis" class="metrics-kpis"></div>
    <h2 class="metrics-section-title">Top produtos</h2>
    <div id="metrics-products" class="metrics-rows"></div>
    <h2 class="metrics-section-title">Top posts</h2>
    <div id="metrics-posts" class="metrics-rows"></div>
    <p id="metrics-error" class="form-error" hidden></p>
  </section>

  <nav id="bottom-nav" class="bottom-nav" hidden>
    <button type="button" class="nav-item active" data-nav="list">
      <span class="nav-label">Posts</span>
    </button>
    <button type="button" class="nav-item" data-nav="metrics">
      <span class="nav-label">Métricas</span>
    </button>
  </nav>

  <section id="screen-detail" class="screen screen-detail" hidden>
    <header class="topbar topbar-fixed">
      <button type="button" class="btn btn-ghost" id="btn-back">← Voltar</button>
      <span id="detail-status" class="badge">draft</span>
    </header>
    <div class="detail-scroll">
      <article class="detail">
        <img id="detail-cover" class="detail-cover" alt="" hidden />
        <h1 id="detail-title"></h1>
        <p id="detail-meta" class="meta"></p>
        <div id="detail-preview" class="detail-preview" aria-label="Pré-visualização do post"></div>
      </article>
    </div>
    <footer id="action-bar" class="action-bar">
      <button type="button" class="btn btn-danger" id="btn-reject">Rejeitar</button>
      <button type="button" class="btn btn-secondary" id="btn-draft">Rascunho</button>
      <button type="button" class="btn btn-primary" id="btn-approve">Aprovar</button>
      <button type="button" class="btn btn-facebook" id="btn-facebook" hidden>Facebook</button>
    </footer>
  </section>

  <script type="module" src="./native-plugins.bundle.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
