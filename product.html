<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papelê Educa - Produto</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --surface-2: #f2efe7;
      --text: #263238;
      --muted: #6c7a86;
      --line: #d8d2c6;
      --accent: #2fb7b0;
      --accent-2: #f4a53b;
      --shadow: 0 14px 40px rgba(35, 41, 50, 0.08);
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 165, 59, 0.16), transparent 22%),
        radial-gradient(circle at top right, rgba(47, 183, 176, 0.14), transparent 20%),
        linear-gradient(180deg, #f8f4ec 0%, #fbfaf7 34%, #f7f4ef 100%);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    body.lightbox-open { overflow: hidden; }

    .page {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 210, 198, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .brand-mark {
      height: 90px;
      display: flex;
      align-items: center;
    }

    .brand-mark img {
      height: 100%;
      width: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-left: auto;
      font-weight: 600;
      color: #40505c;
    }

    .nav a { padding: 6px 2px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #27b4ae, #20a8bb);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(39, 180, 174, 0.22);
      white-space: nowrap;
    }

    .whatsapp-float {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 30;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #28d366, #128c7e);
      color: #fff;
      box-shadow: 0 16px 30px rgba(18, 140, 126, 0.32);
      transition: transform 180ms ease, box-shadow 180ms ease, filter 180ms ease;
    }

    .whatsapp-float:hover,
    .whatsapp-float:focus-visible {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 20px 36px rgba(18, 140, 126, 0.38);
      filter: brightness(1.02);
    }

    .whatsapp-float img {
      width: auto;
      height: 30px;
      display: block;
    }

    .hero-card {
      margin-top: 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(216, 210, 198, 0.75);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 22px;
      align-items: start;
    }

    .gallery {
      display: grid;
      gap: 14px;
      position: relative;
    }

    .main-image {
      position: relative;
      width: 100%;
      aspect-ratio: 1.18 / 0.82;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(216, 210, 198, 0.75);
      background: #fff;
      padding: 0;
      cursor: zoom-in;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: inherit;
    }

    .main-image-hint {
      position: absolute;
      right: 14px;
      bottom: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      color: #3c4954;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 8px 22px rgba(35, 41, 50, 0.12);
      pointer-events: none;
    }

    .carousel-controls {
      position: absolute;
      top: calc(50% - 24px);
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
      z-index: 2;
    }

    .carousel-arrow {
      pointer-events: auto;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.92);
      color: #263238;
      font-size: 1.8rem;
      line-height: 1;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(35, 41, 50, 0.16);
      cursor: pointer;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(72px, 1fr));
      gap: 10px;
    }

    .thumbs button {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
      aspect-ratio: 1 / 1;
      opacity: 0.78;
      transition: transform 0.2s ease, opacity 0.2s ease, border-color 0.2s ease;
    }

    .thumbs button.active {
      border-color: var(--accent);
      opacity: 1;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(39, 180, 174, 0.16);
    }

    .thumbs button:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .thumbs img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-panel {
      background: linear-gradient(180deg, #fff, #fcfaf6);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 24px;
      display: grid;
      gap: 14px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff7ea;
      color: #9a6b17;
      font-weight: 800;
    }

    .product-panel h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 0.9rem;
      color: #4b6071;
    }

    .price-box {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      background: #fff;
      border: 1px solid rgba(216, 210, 198, 0.75);
    }

    .price {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }

    .promo {
      color: var(--accent-2);
      font-weight: 800;
    }

    .description {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.02rem;
    }

    .bullets {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 18px;
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .buy-now {
      min-width: 220px;
      justify-content: center;
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .section {
      margin-top: 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(216, 210, 198, 0.75);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    .detail-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card {
      background: linear-gradient(180deg, #fff, #faf8f3);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      min-height: 140px;
    }

    .info-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .related-section {
      display: grid;
      gap: 18px;
    }

    .related-section .section-head {
      max-width: 760px;
      margin: 0 auto 22px;
      text-align: center;
    }

    .related-carousel {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 12px;
      align-items: center;
    }

    .related-track {
      display: flex;
      gap: 18px;
      overflow-x: auto;
      padding: 4px 2px 14px;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      scrollbar-width: thin;
    }

    .related-track .product {
      scroll-snap-align: start;
      min-height: 100%;
      flex: 0 0 calc((100% - 36px) / 3);
      max-width: calc((100% - 36px) / 3);
    }

    .related-nav {
      width: 46px;
      height: 46px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--text);
      box-shadow: 0 10px 24px rgba(35, 41, 50, 0.12);
      font-size: 1.8rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .product {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 100%;
      padding: 18px;
      border-radius: 28px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(216, 210, 198, 0.72);
      box-shadow: var(--shadow);
    }

    .product-media {
      margin-top: 18px;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(216, 210, 198, 0.65);
      aspect-ratio: 1.18 / 0.82;
    }

    .product-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tag {
      position: absolute;
      top: 14px;
      left: 14px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      color: #fff;
    }

    .tag.pink { background: #ef6f8f; }
    .tag.yellow { background: #f2c24f; color: #5b4622; }
    .tag.teal { background: #2bb9b0; }

    .product h3 {
      margin: 2px 0 0;
      font-size: 1.12rem;
      line-height: 1.2;
    }

    .product-category,
    .product-description {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .product-category {
      font-weight: 700;
      color: #4f6a81;
    }

    .product-description {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 3.1em;
    }

    .product-actions {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .price {
      font-weight: 800;
      font-size: 1.05rem;
    }

    .stars {
      color: #f3b81f;
      letter-spacing: 1px;
      font-size: 0.95rem;
    }

    .product-details {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 999px;
      background: #fff4f7;
      color: #ef6f8f;
      border: 1px solid rgba(239, 111, 143, 0.22);
      font-weight: 800;
      font-size: 0.92rem;
      line-height: 1;
    }

    .product-add {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
      background: #ffe7ef;
      color: #ef6f8f;
      border: none;
      flex: 0 0 auto;
    }

    .footer {
      margin-top: 30px;
      padding: 24px 10px 10px;
      text-align: center;
      color: var(--muted);
    }

    .footer-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(216, 210, 198, 0.85);
      padding-top: 18px;
    }

    .socials {
      width: min(100%, 300px);
    }

    .socials img {
      width: 100%;
      height: auto;
      display: block;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    .lightbox {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 999;
    }

    .lightbox.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(16, 20, 24, 0.82);
      backdrop-filter: blur(6px);
    }

    .lightbox-dialog {
      position: relative;
      width: min(92vw, 1100px);
      max-height: 88vh;
      z-index: 1;
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .lightbox-dialog img {
      max-width: 100%;
      max-height: 82vh;
      width: auto;
      height: auto;
      border-radius: 24px;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.35);
      background: #fff;
    }

    .lightbox-close,
    .lightbox-nav {
      position: absolute;
      border: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
    }

    .lightbox-close {
      top: 0;
      right: 0;
      width: 44px;
      height: 44px;
      border-radius: 999px;
      font-size: 1.4rem;
    }

    .lightbox-nav {
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 999px;
      font-size: 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
    }

    .lightbox-prev { left: 8px; }
    .lightbox-next { right: 8px; }

    @media (max-width: 980px) {
      .detail-grid,
      .detail-cards,
      .products {
        grid-template-columns: 1fr;
      }

      .related-carousel {
        grid-template-columns: 1fr;
      }

      .related-nav {
        display: none;
      }

      .related-track .product {
        flex-basis: calc((100% - 18px) / 2);
        max-width: calc((100% - 18px) / 2);
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .nav {
        justify-content: flex-start;
        margin-left: 0;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 20px, var(--max)); padding-top: 10px; }
      .hero-card, .section { border-radius: 28px; padding: 18px; }
      .buy-now { width: 100%; }
      .price { font-size: 1.7rem; }
      .main-image-hint { font-size: 0.76rem; padding: 7px 10px; }
      .carousel-arrow { width: 38px; height: 38px; font-size: 1.5rem; }
      .lightbox-dialog { padding: 10px; }
      .lightbox-nav { width: 40px; height: 40px; }
      .related-track { gap: 14px; }
      .related-track .product {
        flex-basis: 82vw;
        max-width: 82vw;
      }
      .product { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Papelê Educa">
        <div class="brand-mark">
          <img src="./images/logo-header.png" alt="Papelê Educa" />
        </div>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <a href="./index.html#inicio">Início</a>
        <a href="./index.html#categorias">Categorias</a>
        <a href="./index.html#sobre">Sobre</a>
        <a href="./index.html#contato">Contato</a>
      </nav>

      <a class="btn" href="./index.html#categorias">Explorar materiais</a>
    </header>

    <section id="product-root" class="hero-card">
      <div class="empty-state">Carregando produto...</div>
    </section>

    <section class="section related-section">
      <div class="section-head">
        <h2>Mais materiais para explorar</h2>
        <p>Seleção de materiais pensados para apoiar o aprendizado com praticidade, qualidade e propósito.</p>
      </div>

      <div class="related-carousel">
        <button type="button" class="related-nav" id="related-prev" aria-label="Material anterior">‹</button>
        <div id="related-products" class="related-track" aria-live="polite"></div>
        <button type="button" class="related-nav" id="related-next" aria-label="Próximo material">›</button>
      </div>
    </section>

    <footer class="footer" id="sobre">
      <div class="footer-top">
        <div class="socials" aria-label="Redes sociais">
          <img src="./images/icones-redes.png" alt="Ícones de redes sociais" />
        </div>
      </div>
      <p style="margin-top:14px;">© 2026 Papelê Educa. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script type="module" src="./js/product-page.js"></script>
  <a
    class="whatsapp-float"
    href="https://wa.me/5513997291237?text=Ol%C3%A1%21%20Vim%20pelo%20site%20Papel%C3%AA%20Educa%20e%20gostaria%20de%20mais%20informa%C3%A7%C3%B5es."
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Chamar no WhatsApp"
    title="Falar no WhatsApp"
  >
    <img src="./images/whatsapp-svgrepo-com.svg" alt="" aria-hidden="true" />
  </a>
</body>
</html>
