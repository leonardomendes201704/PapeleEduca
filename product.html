<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Papelê Educa - Produto</title>
  <style>
    :root {
      --bg: #f6f3ec;
      --surface: #ffffff;
      --surface-2: #f2efe7;
      --text: #263238;
      --muted: #6c7a86;
      --line: #d8d2c6;
      --accent: #2fb7b0;
      --accent-2: #f4a53b;
      --shadow: 0 14px 40px rgba(35, 41, 50, 0.08);
      --max: 1180px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(244, 165, 59, 0.16), transparent 22%),
        radial-gradient(circle at top right, rgba(47, 183, 176, 0.14), transparent 20%),
        linear-gradient(180deg, #f8f4ec 0%, #fbfaf7 34%, #f7f4ef 100%);
    }

    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }

    .page {
      width: min(var(--max), calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      position: sticky;
      top: 12px;
      z-index: 10;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(216, 210, 198, 0.7);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }

    .brand-mark {
      height: 90px;
      display: flex;
      align-items: center;
    }

    .brand-mark img {
      height: 100%;
      width: auto;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 22px;
      margin-left: auto;
      font-weight: 600;
      color: #40505c;
    }

    .nav a { padding: 6px 2px; }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 14px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(90deg, #27b4ae, #20a8bb);
      color: #fff;
      font-weight: 700;
      box-shadow: 0 10px 24px rgba(39, 180, 174, 0.22);
      white-space: nowrap;
    }

    .hero-card {
      margin-top: 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(216, 210, 198, 0.75);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 22px;
      align-items: start;
    }

    .gallery {
      display: grid;
      gap: 14px;
    }

    .main-image {
      aspect-ratio: 1.18 / 0.82;
      border-radius: 26px;
      overflow: hidden;
      border: 1px solid rgba(216, 210, 198, 0.75);
      background: #fff;
    }

    .main-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .thumbs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(84px, 1fr));
      gap: 10px;
    }

    .thumbs button {
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid transparent;
    }

    .thumbs button.active {
      border-color: var(--accent);
    }

    .thumbs img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .product-panel {
      background: linear-gradient(180deg, #fff, #fcfaf6);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 24px;
      display: grid;
      gap: 14px;
    }

    .eyebrow {
      display: inline-flex;
      width: fit-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: #fff7ea;
      color: #9a6b17;
      font-weight: 800;
    }

    .product-panel h1 {
      margin: 0;
      font-size: clamp(2rem, 3vw, 3rem);
      line-height: 1.02;
      letter-spacing: -0.04em;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-weight: 700;
    }

    .muted {
      color: var(--muted);
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      font-size: 0.9rem;
      color: #4b6071;
    }

    .price-box {
      display: grid;
      gap: 8px;
      padding: 16px;
      border-radius: 22px;
      background: #fff;
      border: 1px solid rgba(216, 210, 198, 0.75);
    }

    .price {
      font-size: 2rem;
      font-weight: 900;
      line-height: 1;
    }

    .promo {
      color: var(--accent-2);
      font-weight: 800;
    }

    .description {
      color: var(--muted);
      line-height: 1.7;
      font-size: 1.02rem;
    }

    .bullets {
      display: grid;
      gap: 10px;
      margin: 0;
      padding-left: 18px;
      color: var(--text);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 6px;
    }

    .buy-now {
      min-width: 220px;
      justify-content: center;
    }

    .secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
      box-shadow: none;
    }

    .section {
      margin-top: 18px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(216, 210, 198, 0.75);
      border-radius: 36px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .section h2 {
      margin: 0 0 12px;
      font-size: 1.5rem;
    }

    .detail-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .info-card {
      background: linear-gradient(180deg, #fff, #faf8f3);
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 18px;
      min-height: 140px;
    }

    .info-card strong {
      display: block;
      margin-bottom: 8px;
    }

    .footer {
      margin-top: 30px;
      padding: 24px 10px 10px;
      text-align: center;
      color: var(--muted);
    }

    .footer-top {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      border-top: 1px solid rgba(216, 210, 198, 0.85);
      padding-top: 18px;
    }

    .socials {
      width: min(100%, 300px);
    }

    .socials img {
      width: 100%;
      height: auto;
      display: block;
    }

    .empty-state {
      padding: 40px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .detail-grid,
      .detail-cards {
        grid-template-columns: 1fr;
      }

      .topbar {
        flex-direction: column;
        align-items: stretch;
      }

      .nav {
        justify-content: flex-start;
        margin-left: 0;
        flex-wrap: wrap;
      }
    }

    @media (max-width: 640px) {
      .page { width: min(100% - 20px, var(--max)); padding-top: 10px; }
      .hero-card, .section { border-radius: 28px; padding: 18px; }
      .buy-now { width: 100%; }
      .price { font-size: 1.7rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <a class="brand" href="./index.html" aria-label="Papelê Educa">
        <div class="brand-mark">
          <img src="./images/logo-header.png" alt="Papelê Educa" />
        </div>
      </a>

      <nav class="nav" aria-label="Navegação principal">
        <a href="./index.html#inicio">Início</a>
        <a href="./index.html#categorias">Categorias</a>
        <a href="./index.html#sobre">Sobre</a>
        <a href="./index.html#contato">Contato</a>
      </nav>

      <a class="btn" href="./index.html#categorias">Explorar materiais</a>
    </header>

    <section id="product-root" class="hero-card">
      <div class="empty-state">Carregando produto...</div>
    </section>

    <footer class="footer" id="sobre">
      <div class="footer-top">
        <div class="socials" aria-label="Redes sociais">
          <img src="./images/icones-redes.png" alt="Ícones de redes sociais" />
        </div>
      </div>
      <p style="margin-top:14px;">© 2026 Papelê Educa. Todos os direitos reservados.</p>
    </footer>
  </main>

  <script type="module" src="./js/product-page.js"></script>
</body>
</html>
